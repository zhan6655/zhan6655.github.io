name: deploy-checkin-site-v5
on:
  push:
    paths-ignore:
      - 'index.html'
      - 'icon.png'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: deploy-site-v5
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch page
        run: curl -fsSL "https://aka.doubaocdn.com/s/pyzT3x39V4" -o index.html
      - name: Verify hash
        run: test "$(sha256sum index.html | cut -d' ' -f1)" = "e358bf944b4308b74fcfeb21343225aedd2fead468678796cc08bb074e300181"
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "deploy: merge amap and osm address" || echo "no changes"
          git push
