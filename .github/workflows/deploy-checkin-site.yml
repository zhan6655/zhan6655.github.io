name: deploy-checkin-site-v6
on:
  push:
    paths-ignore:
      - 'index.html'
      - 'icon.png'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: deploy-site-v6
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch page
        run: curl -fsSL "https://aka.doubaocdn.com/s/AUUpIWbWnf" -o index.html
      - name: Verify hash
        run: test "$(sha256sum index.html | cut -d' ' -f1)" = "13e44e8f162f0fadd4d33c3aeb34cca47ba16837e76bc4a54cb0f23669efb33b"
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "deploy: lock page zoom on iOS" || echo "no changes"
          git push
