name: deploy-checkin-site-v3
on:
  push:
    paths-ignore:
      - 'index.html'
      - 'icon.png'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: deploy-site-v3
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch page
        run: curl -fsSL "https://aka.doubaocdn.com/s/IINjGqjtfb" -o index.html
      - name: Verify hash
        run: test "$(sha256sum index.html | cut -d' ' -f1)" = "3d22b3ffbbf409889829d65ee418372b73d0a3d1afbc1993754843fb06f8891f"
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "deploy: watermark with address" || echo "no changes"
          git push
