name: deploy-index
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-index.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and verify
        run: |
          curl -fsSL -o /tmp/index.html "https://aka.doubaocdn.com/s/RHW0AkOv5M"
          echo "0f51787372cd0d6f129d9096820dba6c487ebde9007f2a3d0aef91735e658898  /tmp/index.html" | sha256sum -c -
          cp /tmp/index.html index.html
          ls -l index.html
      - name: Commit and push
        run: |
          git config user.name "zhan6655"
          git config user.email "659150399@QQ.com"
          git add index.html
          git commit -m "feat: 一天多段打卡（六段 + 调班休假）" || echo "no change"
          git push
