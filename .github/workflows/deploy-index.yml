name: deploy-index
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-index.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and verify
        run: |
          curl -fsSL -o /tmp/index.html "https://aka.doubaocdn.com/s/bHoZDoN980"
          echo "d46145a5d391936d2b719b7476e9d93e28f458496f72f606363448b188838d69  /tmp/index.html" | sha256sum -c -
          cp /tmp/index.html index.html
          ls -l index.html
      - name: Commit and push
        run: |
          git config user.name "zhan6655"
          git config user.email "659150399@QQ.com"
          git add index.html
          git commit -m "feat: 新增备份导入（合并），打通主屏 App 与 Safari 两套存储" || echo "no change"
          git push
